name: Quality assurance

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Prepare virtual environment
        run: make configure

      - name: Test
        run: make test

      - name: Check types
        run: make type-check

      - name: Lint
        run: make lint
